<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132257">
<title>Révisions d'ACE</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Révisions ACE">
<style>
:root{
  --paper:#F4EFE4; --card:#FCF8F0; --line:#E6DCC8; --ink:#24262C; --soft:#7c7566;
  --fr:#A5243D; --fr-d:#7a172c; --fr-bg:#F4DEE3;
  --ma:#2F6DB0; --ma-d:#164a86; --ma-bg:#DCEAF6;
  --an:#1D8F63; --an-d:#0f6e4e; --an-bg:#DDF1E7;
  --ok:#2E8B57; --ok-d:#0f6e4e; --ok-bg:#EAF6EE;
  --no:#C86B4A; --no-d:#8a3d1d; --no-bg:#FBEBE3;
  --nav:#132257; --gold:#E9B84A;
  --hg:#B5793C; --hg-d:#7d5320; --hg-bg:#F2E7D6;
  --sc:#7A5AC2; --sc-d:#4a3488; --sc-bg:#E9E2F7;
  --em:#2F8F8F; --em-d:#1f6b6b; --em-bg:#D9EFEF;
  --scale:1;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:'Trebuchet MS','Segoe UI',Verdana,Tahoma,system-ui,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:calc(18px*var(--scale)); line-height:1.7;
  letter-spacing:.02em; word-spacing:.06em;
  text-align:left;
  padding:0 0 96px 0;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px; margin:0 auto; padding:16px 16px 0;}
h1,h2,h3{font-weight:normal; line-height:1.4; margin:0 0 10px;}
h1{font-size:1.35em;} h2{font-size:1.15em;} h3{font-size:1.05em;}
button{font-family:inherit; cursor:pointer;}
.hidden{display:none !important;}

.topbar{display:flex; align-items:center; gap:10px; margin:8px 0 18px;}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--fr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2em;flex:0 0 auto;}
.hello{font-size:1.2em;}
.date{font-size:.82em;color:var(--soft);}
.aa{margin-left:auto;display:flex;gap:6px;}
.aa button{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--soft);padding:6px 10px;font-size:.85em;}
.aa button.on{background:var(--fr-bg);color:var(--fr-d);border-color:var(--fr);}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;}
.card .lbl{font-size:.82em;color:var(--soft);margin-bottom:4px;}
.big{font-size:1.15em;margin-bottom:12px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:6px 12px;border-radius:12px;font-size:.85em;display:inline-flex;align-items:center;gap:6px;}
.chip.fr{background:var(--fr-bg);color:var(--fr-d);} .chip.ma{background:var(--ma-bg);color:var(--ma-d);} .chip.an{background:var(--an-bg);color:var(--an-d);}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em;}

.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:1.05em;text-align:center;}
.btn-fr{background:var(--fr);color:#fff;} .btn-ma{background:var(--ma);color:#fff;}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);}
.btn-ok{background:var(--ok);color:#fff;}
.btn:disabled{opacity:.55;}

.mini{font-size:.9em;}
.fichelink{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;}
.dot.fr{background:var(--fr);} .dot.ma{background:var(--ma);} .dot.an{background:var(--an);}
.fichelink .go{margin-left:auto;color:var(--soft);}
.done-badge{color:var(--ok-d);font-size:.9em;}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
.cal .h{font-size:.72em;color:var(--soft);text-align:center;padding:2px 0;}
.day{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.95em;position:relative;padding:2px;}
.day .n{font-size:1em;}
.day .s{font-size:.62em;margin-top:2px;line-height:1;}
.day.todo{border:2px solid var(--fr);background:var(--fr-bg);color:var(--fr-d);}
.day.late{border:2px solid var(--an);background:var(--an-bg);color:var(--an-d);}
.day.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-d);}
.day.lock{opacity:.45;}
.day.empty{border:none;background:transparent;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8em;color:var(--soft);margin-top:12px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}

/* Suivi */
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.row .d{font-size:.85em;width:70px;color:var(--soft);}
.bar{flex:1;height:16px;border-radius:8px;background:var(--fr-bg);overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--fr);}
.row .v{font-size:.9em;width:56px;text-align:right;}
.stat{display:flex;gap:10px;margin-bottom:16px;}
.stat .b{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
.stat .b .k{font-size:.78em;color:var(--soft);} .stat .b .val{font-size:1.4em;}

/* QCM overlay */
.overlay{position:fixed;inset:0;background:var(--paper);z-index:50;overflow-y:auto;display:none;}
.overlay.on{display:block;}
.qhead{position:sticky;top:0;background:var(--paper);padding:14px 16px 8px;}
.qhead .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.qclose{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--soft);}
.prog{flex:1;height:10px;border-radius:6px;background:var(--card);border:1px solid var(--line);overflow:hidden;}
.prog>i{display:block;height:100%;background:var(--fr);width:0;transition:width .3s;}
.qcount{font-size:.82em;color:var(--soft);}
.qbody{max-width:520px;margin:0 auto;padding:6px 16px 40px;}
.qtag{display:inline-flex;align-items:center;gap:6px;font-size:.8em;padding:4px 10px;border-radius:10px;margin-bottom:12px;}
.qtag.fr{background:var(--fr-bg);color:var(--fr-d);} .qtag.ma{background:var(--ma-bg);color:var(--ma-d);} .qtag.an{background:var(--an-bg);color:var(--an-d);}
.qtext{font-size:1.2em;line-height:1.7;margin-bottom:18px;}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:1.05em;color:var(--ink);}
.opt .oic{font-size:1.2em;opacity:0;}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-d);}
.opt.correct .oic{opacity:1;color:var(--ok);}
.opt.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no-d);}
.opt.wrong .oic{opacity:1;color:var(--no);}
.opt:disabled{cursor:default;}
.feedback{border-radius:14px;padding:14px 16px;margin:6px 0 16px;line-height:1.7;}
.feedback.good{background:var(--ok-bg);border-left:5px solid var(--ok);}
.feedback.bad{background:var(--no-bg);border-left:5px solid var(--no);}
.feedback .enc{font-size:1.05em;margin-bottom:6px;}
.feedback.good .enc{color:var(--ok-d);} .feedback.bad .enc{color:var(--no-d);}
.feedback .expl{font-size:.95em;}

/* Results */
.result-score{text-align:center;padding:10px 0 6px;}
.result-score .note{font-size:2.6em;color:var(--fr-d);}
.result-score .pct{font-size:1em;color:var(--soft);}
.miss{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card);}
.miss .mq{font-size:.98em;margin-bottom:6px;}
.miss .ma-line{font-size:.9em;color:var(--ok-d);}
.miss .me-line{font-size:.9em;color:var(--no-d);margin-top:2px;}

/* Fiche reader */
.fiche-read{max-width:520px;margin:0 auto;padding:6px 16px 40px;}
.fiche-h{font-size:1.4em;margin:6px 0 4px;}
.fiche-sec{margin:14px 0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);}
.fiche-sec .st{font-size:1.05em;margin-bottom:8px;}
.hl{padding:1px 6px;border-radius:6px;}
.hl-fr{background:var(--fr-bg);color:var(--fr-d);} .hl-ma{background:var(--ma-bg);color:var(--ma-d);} .hl-an{background:var(--an-bg);color:var(--an-d);} .hl-ok{background:var(--ok-bg);color:var(--ok-d);}
.ex{background:var(--paper);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.96em;}
.readbox{display:flex;align-items:center;gap:12px;background:var(--ok-bg);border:2px solid var(--ok);border-radius:14px;padding:14px 16px;margin-top:20px;color:var(--ok-d);}
.readbox.checked{background:var(--ok);color:#fff;}
.readbox .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ok);display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:#fff;color:var(--ok);}
.readbox.checked .box{background:#fff;color:var(--ok);}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40;}
.nav button{flex:1;background:none;border:none;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72em;padding:4px;}
.nav button .ic{width:1.5em;height:1.5em;}
.nav button.on{color:var(--nav);}
.section{display:none;} .section.on{display:block;}
.emptynote{color:var(--soft);font-size:.92em;padding:6px 0;}

.chip.hg{background:var(--hg-bg);color:var(--hg-d);} .chip.sc{background:var(--sc-bg);color:var(--sc-d);} .chip.em{background:var(--em-bg);color:var(--em-d);}
.dot.hg{background:var(--hg);} .dot.sc{background:var(--sc);} .dot.em{background:var(--em);}
.qtag.hg{background:var(--hg-bg);color:var(--hg-d);} .qtag.sc{background:var(--sc-bg);color:var(--sc-d);} .qtag.em{background:var(--em-bg);color:var(--em-d);}
.hl-hg{background:var(--hg-bg);color:var(--hg-d);} .hl-sc{background:var(--sc-bg);color:var(--sc-d);} .hl-em{background:var(--em-bg);color:var(--em-d);}
.fig{margin:12px 0;text-align:center;}
.fig svg{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;}
.calc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:10px 0;}
.calc .cl{padding:7px 0;border-bottom:1px dashed var(--line);line-height:1.6;}
.calc .cl:last-child{border-bottom:none;}
.calc .cw{color:var(--soft);font-size:.85em;display:block;margin-top:1px;}

.dictee-texte{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:1.02em;}
.dictee-texte-lire{background:var(--card);border:2px solid var(--hg);border-radius:12px;padding:6px 14px;margin:10px 0;font-size:1.3em;line-height:1.9;}
.dphrase{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;}
.dphrase:last-child{border-bottom:none;}
.mini-listen{background:var(--hg-bg);color:var(--hg-d);border:1px solid var(--hg);border-radius:8px;padding:6px 12px;font-size:.85em;flex:0 0 auto;}
.fautes-row{display:flex;align-items:center;justify-content:center;gap:22px;margin:12px 0 16px;}
.fbtn{width:52px;height:52px;border-radius:50%;border:2px solid var(--fr);background:var(--card);color:var(--fr-d);font-size:1.6em;line-height:1;}
.fnum{font-size:2.2em;min-width:56px;text-align:center;color:var(--ink);}
</style>
</head>
<body>

<!-- ============ MAIN ============ -->
<div id="main">
  <div class="wrap">
    <div class="topbar">
      <div class="avatar" id="avatarIcon"></div>
      <div>
        <div class="hello">Salut <b>ACE</b> !</div>
        <div class="date" id="todayStr"></div>
      </div>
      <div class="aa">
        <button data-scale="1" class="on">A</button>
        <button data-scale="1.18">A+</button>
      </div>
    </div>

    <!-- ACCUEIL -->
    <div class="section on" id="sec-accueil"></div>
    <!-- TEST -->
    <div class="section" id="sec-test"></div>
    <!-- SUIVI -->
    <div class="section" id="sec-suivi"></div>
    <!-- FICHES -->
    <div class="section" id="sec-fiches"></div>
    <div class="section" id="sec-dictee"></div>
  </div>
</div>

<!-- ============ QCM OVERLAY ============ -->
<div class="overlay" id="qcm">
  <div class="qhead">
    <div class="top">
      <button class="qclose" id="qClose">✕ Quitter</button>
      <div class="prog"><i id="qProg"></i></div>
      <div class="qcount" id="qCount"></div>
    </div>
  </div>
  <div class="qbody" id="qBody"></div>
</div>

<!-- ============ FICHE OVERLAY ============ -->
<div class="overlay" id="ficheView">
  <div class="qhead">
    <div class="top">
      <button class="qclose" id="fClose">✕ Retour</button>
      <div style="flex:1"></div>
    </div>
  </div>
  <div class="fiche-read" id="fBody"></div>
</div>

<!-- ============ DICTÉE OVERLAY ============ -->
<div class="overlay" id="dicteeView">
  <div class="qhead"><div class="top"><button class="qclose" id="dClose">✕ Retour</button><div style="flex:1"></div></div></div>
  <div class="fiche-read" id="dBody"></div>
</div>

<!-- ============ BOTTOM NAV ============ -->
<nav class="nav">
  <button data-tab="accueil" class="on">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    Accueil
  </button>
  <button data-tab="test">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Test
  </button>
  <button data-tab="suivi">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Suivi
  </button>
  <button data-tab="fiches">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v6h6M8 14h8M8 18h6"/></svg>
    Fiches
  </button>
  <button data-tab="dictee">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    Dictée
  </button>
</nav>

<script id="app">
"use strict";

/* ================= DONNÉES ================= */
const BANQUE = [

{id:"am29",matiere:"maths",niveau:"facile",q:"Combien font 25 × 4 ?",choix:["100","90","110","75"],bonne:0,expl:"25 × 4 = 100."},
{id:"am30",matiere:"maths",niveau:"facile",q:"Combien font 13 × 3 ?",choix:["39","36","43","33"],bonne:0,expl:"13 × 3 = 39."},
{id:"am31",matiere:"maths",niveau:"moyen",q:"Dans le nombre 3 528, quel est le chiffre des centaines ?",choix:["5","3","2","8"],bonne:0,expl:"Centaines = 3ᵉ chiffre en partant de la droite : 3(5)28 → 5."},
{id:"am32",matiere:"maths",niveau:"facile",q:"Quel est le plus grand nombre ?",choix:["4 521","4 512","4 251","4 125"],bonne:0,expl:"On compare chiffre par chiffre à partir de la gauche : 4 521 est le plus grand."},
{id:"am33",matiere:"maths",niveau:"moyen",q:"Comment s'écrit « trois mille deux cents » en chiffres ?",choix:["3 200","3 020","32 000","3 002"],bonne:0,expl:"Trois mille = 3 000, deux cents = 200 → 3 200."},
{id:"am34",matiere:"maths",niveau:"facile",q:"Quel nombre est pair ?",choix:["8","3","5","9"],bonne:0,expl:"Un nombre pair se termine par 0, 2, 4, 6 ou 8. Ici, 8 est pair."},
{id:"am35",matiere:"maths",niveau:"facile",q:"Quel est le double de 25 ?",choix:["50","55","45","35"],bonne:0,expl:"Le double, c'est × 2 : 25 × 2 = 50."},
{id:"am36",matiere:"maths",niveau:"facile",q:"Quelle est la moitié de 50 ?",choix:["25","20","30","15"],bonne:0,expl:"La moitié, c'est ÷ 2 : 50 ÷ 2 = 25."},
{id:"am37",matiere:"maths",niveau:"facile",q:"Combien y a-t-il de dizaines dans 100 ?",choix:["10","100","1","1000"],bonne:0,expl:"100 = 10 dizaines (10 × 10 = 100)."},
{id:"am38",matiere:"maths",niveau:"moyen",q:"Arrondis 47 à la dizaine la plus proche.",choix:["50","40","45","47"],bonne:0,expl:"47 est entre 40 et 50, plus proche de 50. Arrondi : 50."},
{id:"am39",matiere:"maths",niveau:"facile",important:true,q:"Combien font la moitié (1/2) de 10 ?",choix:["5","4","6","2"],bonne:0,expl:"1/2 de 10 = 10 ÷ 2 = 5."},
{id:"am40",matiere:"maths",niveau:"facile",important:true,q:"Combien font le quart (1/4) de 20 ?",choix:["5","4","10","8"],bonne:0,expl:"1/4 de 20 = 20 ÷ 4 = 5."},
{id:"am41",matiere:"maths",niveau:"moyen",important:true,q:"Combien font le tiers (1/3) de 9 ?",choix:["3","4","6","2"],bonne:0,expl:"1/3 de 9 = 9 ÷ 3 = 3."},
{id:"am42",matiere:"maths",niveau:"facile",important:true,q:"Combien vaut 1/2 en nombre décimal ?",choix:["0,5","0,2","0,25","5"],bonne:0,expl:"Un demi = 0,5."},
{id:"am43",matiere:"maths",niveau:"moyen",important:true,q:"Combien vaut 1/4 en nombre décimal ?",choix:["0,25","0,5","0,4","0,75"],bonne:0,expl:"Un quart = 0,25."},
{id:"am44",matiere:"maths",niveau:"moyen",important:true,q:"Combien vaut 3/4 en nombre décimal ?",choix:["0,75","0,34","0,5","0,25"],bonne:0,expl:"Trois quarts = 0,75."},
{id:"am45",matiere:"maths",niveau:"facile",important:true,q:"Combien font 0,5 + 0,5 ?",choix:["1","0,10","0,55","2"],bonne:0,expl:"0,5 + 0,5 = 1 (deux demis font un entier)."},
{id:"am46",matiere:"maths",niveau:"moyen",q:"Combien font 2,5 + 1,5 ?",choix:["4","3,10","4,10","3"],bonne:0,expl:"2,5 + 1,5 = 4 (les 0,5 + 0,5 font 1, plus 2 + 1 = 3, donc 4)."},
{id:"am47",matiere:"maths",niveau:"moyen",important:true,q:"Quel nombre est le plus grand : 0,7 ou 0,65 ?",choix:["0,7","0,65","ils sont égaux","impossible à dire"],bonne:0,expl:"0,7 = 0,70. Or 70 centièmes > 65 centièmes, donc 0,7 est plus grand."},
{id:"am48",matiere:"maths",niveau:"moyen",q:"Combien vaut 3/10 en nombre décimal ?",choix:["0,3","0,03","3","0,13"],bonne:0,expl:"3 dixièmes = 0,3."},
{id:"am49",matiere:"maths",niveau:"moyen",q:"Combien font 1,2 + 0,8 ?",choix:["2","1,10","2,10","1,28"],bonne:0,expl:"1,2 + 0,8 = 2 (0,2 + 0,8 = 1, plus 1 = 2)."},
{id:"am50",matiere:"maths",niveau:"facile",q:"Quelle est la moitié de 5 ?",choix:["2,5","2","3","2,2"],bonne:0,expl:"5 ÷ 2 = 2,5."},
{id:"am51",matiere:"maths",niveau:"moyen",q:"Combien font les 3/4 de 20 ?",choix:["15","12","16","10"],bonne:0,expl:"20 ÷ 4 = 5 (un quart), puis × 3 = 15."},
{id:"am52",matiere:"maths",niveau:"facile",q:"Combien vaut 1/10 en nombre décimal ?",choix:["0,1","0,01","1","0,10"],bonne:0,expl:"Un dixième = 0,1."},
{id:"am53",matiere:"maths",niveau:"difficile",q:"Dans le nombre 12,05, le chiffre 5 est à la place des…",choix:["centièmes","dixièmes","unités","dizaines"],bonne:0,expl:"Après la virgule : 1ᵉʳ chiffre = dixièmes (0), 2ᵉ = centièmes (5). Donc 5 est aux centièmes."},
{id:"am54",matiere:"maths",niveau:"moyen",q:"Combien font 0,25 + 0,25 ?",choix:["0,5","0,50","0,4","0,20"],bonne:0,expl:"0,25 + 0,25 = 0,50 = 0,5 (deux quarts font un demi)."},
{id:"am55",matiere:"maths",niveau:"moyen",q:"Quel nombre est le plus grand : 1,5 ou 1,45 ?",choix:["1,5","1,45","ils sont égaux","1,455"],bonne:0,expl:"1,5 = 1,50. Or 50 centièmes > 45 centièmes, donc 1,5 est plus grand."},
{id:"am56",matiere:"maths",niveau:"facile",q:"Quel est le périmètre d'un carré de côté 5 cm ?",choix:["20 cm","25 cm","10 cm","15 cm"],bonne:0,expl:"Périmètre = 4 côtés : 5 × 4 = 20 cm."},
{id:"am57",matiere:"maths",niveau:"moyen",q:"Quelle est l'aire d'un rectangle de 4 cm sur 3 cm ?",choix:["12 cm²","14 cm²","7 cm²","24 cm²"],bonne:0,expl:"Aire = longueur × largeur = 4 × 3 = 12 cm²."},
{id:"am58",matiere:"maths",niveau:"facile",q:"Combien mesure un angle droit ?",choix:["90°","180°","45°","100°"],bonne:0,expl:"Un angle droit (le coin d'une feuille) mesure 90°."},
{id:"am59",matiere:"maths",niveau:"facile",q:"1 mètre, c'est combien de centimètres ?",choix:["100 cm","10 cm","1000 cm","50 cm"],bonne:0,expl:"1 m = 100 cm."},
{id:"am60",matiere:"maths",niveau:"facile",q:"1 kilogramme, c'est combien de grammes ?",choix:["1000 g","100 g","10 g","500 g"],bonne:0,expl:"1 kg = 1000 g."},
{id:"am61",matiere:"maths",niveau:"facile",q:"1 heure, c'est combien de minutes ?",choix:["60 min","100 min","30 min","24 min"],bonne:0,expl:"1 heure = 60 minutes."},
{id:"am62",matiere:"maths",niveau:"facile",q:"2 mètres, c'est combien de centimètres ?",choix:["200 cm","20 cm","2000 cm","250 cm"],bonne:0,expl:"1 m = 100 cm, donc 2 m = 200 cm."},
{id:"am63",matiere:"maths",niveau:"moyen",q:"500 g, c'est combien de kilogrammes ?",choix:["0,5 kg","5 kg","50 kg","0,05 kg"],bonne:0,expl:"1000 g = 1 kg, donc 500 g = 0,5 kg (un demi-kilo)."},
{id:"am64",matiere:"maths",niveau:"facile",q:"Une demi-heure, c'est combien de minutes ?",choix:["30 min","15 min","60 min","20 min"],bonne:0,expl:"Une demi-heure = 60 ÷ 2 = 30 minutes."},
{id:"am65",matiere:"maths",niveau:"moyen",q:"Périmètre d'un rectangle de longueur 5 cm et largeur 3 cm ?",choix:["16 cm","15 cm","8 cm","13 cm"],bonne:0,expl:"On additionne les 4 côtés : 5 + 3 + 5 + 3 = 16 cm."},
{id:"am66",matiere:"maths",niveau:"difficile",q:"4 paquets contiennent chacun 6 gâteaux. Combien de gâteaux en tout ?",choix:["24","20","10","18"],bonne:0,expl:"4 × 6 = 24 gâteaux."},
{id:"am67",matiere:"maths",niveau:"moyen",q:"3 stylos coûtent 2 € chacun. Prix total ?",choix:["6 €","5 €","8 €","3 €"],bonne:0,expl:"3 × 2 € = 6 €."},
{id:"am68",matiere:"maths",niveau:"difficile",q:"Ace a 12 billes, il en gagne 8 puis en perd 5. Combien lui en reste-t-il ?",choix:["15","25","20","9"],bonne:0,expl:"12 + 8 = 20, puis 20 − 5 = 15 billes."},
{id:"am69",matiere:"maths",niveau:"difficile",q:"Une baguette coûte 0,90 €. Ace paie avec 2 €. Combien lui rend-on ?",choix:["1,10 €","1,20 €","0,90 €","1 €"],bonne:0,expl:"2 € − 0,90 € = 1,10 €."},
{id:"am70",matiere:"maths",niveau:"difficile",q:"24 élèves sont répartis en groupes de 4. Combien de groupes ?",choix:["6","8","4","12"],bonne:0,expl:"24 ÷ 4 = 6 groupes."},
{id:"am71",matiere:"maths",niveau:"difficile",q:"Un match dure 90 min et commence à 14h00. À quelle heure finit-il ?",choix:["15h30","15h00","16h00","14h90"],bonne:0,expl:"90 min = 1h30. 14h00 + 1h30 = 15h30."},
{id:"am72",matiere:"maths",niveau:"difficile",q:"Un ruban mesure 1 m. On coupe 35 cm. Quelle longueur reste-t-il ?",choix:["65 cm","75 cm","55 cm","35 cm"],bonne:0,expl:"1 m = 100 cm. 100 − 35 = 65 cm."},
{id:"am73",matiere:"maths",niveau:"difficile",q:"5 boîtes contiennent chacune 12 œufs. Combien d'œufs en tout ?",choix:["60","55","50","72"],bonne:0,expl:"5 × 12 = 60 œufs."},
{id:"am74",matiere:"maths",niveau:"difficile",q:"Un jus coûte 1,20 €. Ace en achète 2. Combien paie-t-il ?",choix:["2,40 €","2,20 €","1,40 €","3,20 €"],bonne:0,expl:"2 × 1,20 € = 2,40 €."},
{id:"am75",matiere:"maths",niveau:"moyen",q:"Ace a 25 images, il en colle 18. Combien lui en reste-t-il ?",choix:["7","8","6","17"],bonne:0,expl:"25 − 18 = 7 images."},
{id:"am76",matiere:"maths",niveau:"difficile",q:"Un livre a 96 pages. Ace lit 40 pages, puis 25. Combien reste-t-il à lire ?",choix:["31","35","21","41"],bonne:0,expl:"40 + 25 = 65 pages lues. 96 − 65 = 31 pages restantes."},
{id:"am77",matiere:"maths",niveau:"moyen",q:"Une classe compte 27 élèves, 3 sont absents. Combien de présents ?",choix:["24","23","25","30"],bonne:0,expl:"27 − 3 = 24 élèves présents."},
{id:"am78",matiere:"maths",niveau:"facile",q:"Sur un terrain, il y a 2 équipes de 11 joueurs. Combien de joueurs en tout ?",choix:["22","21","20","24"],bonne:0,expl:"2 × 11 = 22 joueurs."},

/* ================= FRANÇAIS ================= */
{id:"af01",matiere:"francais",niveau:"facile",q:"« Il ___ faim. » « a » ou « à » ?",choix:["a","à","as","ah"],bonne:0,expl:"On peut dire « il AVAIT faim » : verbe avoir → « a » sans accent."},
{id:"af02",matiere:"francais",niveau:"facile",q:"« Je vais ___ l'école. » « a » ou « à » ?",choix:["à","a","as","ah"],bonne:0,expl:"C'est une direction, on met « à » avec accent."},
{id:"af03",matiere:"francais",niveau:"facile",q:"« Il ___ content. » « et » ou « est » ?",choix:["est","et","es","ait"],bonne:0,expl:"On peut dire « il ÉTAIT content » : verbe être → « est »."},
{id:"af04",matiere:"francais",niveau:"facile",q:"« Un chien ___ un chat. » « et » ou « est » ?",choix:["et","est","ai","ait"],bonne:0,expl:"On relie deux mots (= « puis ») : c'est « et »."},
{id:"af05",matiere:"francais",niveau:"facile",q:"« Ils ___ gagné. » « on » ou « ont » ?",choix:["ont","on","ond","hont"],bonne:0,expl:"On peut dire « ils AVAIENT gagné » : verbe avoir → « ont »."},
{id:"af06",matiere:"francais",niveau:"facile",q:"« ___ joue au foot. » « On » ou « Ont » ?",choix:["On","Ont","Ond","Hon"],bonne:0,expl:"« On » = « il / nous ». On peut dire « IL joue » → « On »."},
{id:"af07",matiere:"francais",niveau:"facile",q:"« Ils ___ dans le jardin. » « son » ou « sont » ?",choix:["sont","son","sons","cont"],bonne:0,expl:"On peut dire « ils ÉTAIENT » : verbe être → « sont »."},
{id:"af08",matiere:"francais",niveau:"facile",q:"« ___ ballon est neuf. » « Son » ou « Sont » ?",choix:["Son","Sont","Sson","Ont"],bonne:0,expl:"« Son » montre la possession. On peut dire « MON ballon »."},
{id:"af09",matiere:"francais",niveau:"facile",q:"« ___ es-tu ? » « Ou » ou « Où » ?",choix:["Où","Ou","Oud","Houx"],bonne:0,expl:"On parle d'un lieu → « Où » avec accent."},
{id:"af10",matiere:"francais",niveau:"facile",q:"« Tu veux du thé ___ du café ? » « ou » ou « où » ?",choix:["ou","où","oud","hou"],bonne:0,expl:"C'est un choix (= ou bien) → « ou » sans accent."},
{id:"af11",matiere:"francais",niveau:"facile",q:"« Il aime ___ parents. » (les siens) « ses » ou « ces » ?",choix:["ses","ces","c'est","sais"],bonne:0,expl:"« ses » = les siens. On peut dire « MES parents »."},
{id:"af12",matiere:"francais",niveau:"facile",q:"« Regarde ___ nuages. » (là-haut) « ces » ou « ses » ?",choix:["ces","ses","c'est","sais"],bonne:0,expl:"« ces » sert à montrer. On peut dire « CE nuage / CES nuages »."},
{id:"af13",matiere:"francais",niveau:"moyen",q:"« J'aime le foot, ___ pas le tennis. » « mes » ou « mais » ?",choix:["mais","mes","met","m'est"],bonne:0,expl:"« mais » exprime l'opposition (= pourtant). « mes » = plusieurs à moi."},
{id:"af14",matiere:"francais",niveau:"moyen",q:"« Où sont ___ chaussures ? » « mes » ou « mais » ?",choix:["mes","mais","mets","m'est"],bonne:0,expl:"« mes » = plusieurs choses à moi (mes chaussures)."},
{id:"af15",matiere:"francais",niveau:"moyen",q:"« Elle est ___. » (ici, à cet endroit) « la » ou « là » ?",choix:["là","la","l'a","las"],bonne:0,expl:"« là » (avec accent) indique le lieu. « la » est un petit mot devant un nom (la balle)."},
{id:"af16",matiere:"francais",niveau:"facile",q:"Conjugue « chanter » avec « je » (présent).",choix:["je chante","je chantes","je chantent","je chanter"],bonne:0,expl:"Verbe en -er avec « je » → -e : « je chante »."},
{id:"af17",matiere:"francais",niveau:"facile",q:"Conjugue « finir » avec « nous » (présent).",choix:["nous finissons","nous finisons","nous finons","nous finissont"],bonne:0,expl:"« nous finissons » (double s, -ons)."},
{id:"af18",matiere:"francais",niveau:"facile",q:"Conjugue « être » avec « ils » (présent).",choix:["ils sont","ils sonts","ils est","ils ont"],bonne:0,expl:"« ils sont » (verbe être au présent)."},
{id:"af19",matiere:"francais",niveau:"facile",q:"Conjugue « avoir » avec « je » (présent).",choix:["j'ai","j'ais","j'has","je ai"],bonne:0,expl:"« j'ai » (verbe avoir au présent)."},
{id:"af20",matiere:"francais",niveau:"facile",q:"Conjugue « aller » avec « tu » (présent).",choix:["tu vas","tu va","tu vais","tu allais"],bonne:0,expl:"« tu vas » (avec un s, comme souvent avec « tu »)."},
{id:"af21",matiere:"francais",niveau:"moyen",q:"Conjugue « faire » avec « nous » (présent).",choix:["nous faisons","nous faisions","nous fesons","nous faites"],bonne:0,expl:"« nous faisons » (attention, on écrit ai même si on entend « e »)."},
{id:"af22",matiere:"francais",niveau:"moyen",q:"Conjugue « venir » avec « il » (présent).",choix:["il vient","il viens","il vent","il venir"],bonne:0,expl:"« il vient » (avec un t à la 3ᵉ personne)."},
{id:"af23",matiere:"francais",niveau:"moyen",q:"Imparfait de « être » avec « il » :",choix:["il était","il est","il sera","il a été"],bonne:0,expl:"À l'imparfait : « il était »."},
{id:"af24",matiere:"francais",niveau:"moyen",q:"Futur simple de « avoir » avec « je » :",choix:["j'aurai","j'avais","j'ai","j'aurais"],bonne:0,expl:"Au futur : « j'aurai » (une seule chose à venir, terminaison -ai)."},
{id:"af25",matiere:"francais",niveau:"moyen",q:"Passé composé de « manger » avec « je » :",choix:["j'ai mangé","je mange","j'ai manger","je mangé"],bonne:0,expl:"avoir au présent + participe passé : « j'ai mangé »."},
{id:"af26",matiere:"francais",niveau:"moyen",q:"Conjugue « prendre » avec « je » (présent).",choix:["je prends","je prend","je prens","je prendre"],bonne:0,expl:"« je prends » (avec ds à la fin)."},
{id:"af27",matiere:"francais",niveau:"moyen",q:"Conjugue « dire » avec « vous » (présent).",choix:["vous dites","vous disez","vous dictes","vous disiez"],bonne:0,expl:"« vous dites » (forme irrégulière à retenir)."},
{id:"af28",matiere:"francais",niveau:"facile",q:"Quel est le pluriel de « cheval » ?",choix:["chevaux","chevals","chevaus","cheveaux"],bonne:0,expl:"Les mots en -al font souvent -aux : cheval → chevaux."},
{id:"af29",matiere:"francais",niveau:"facile",q:"Quel est le pluriel de « chou » ?",choix:["choux","chous","choues","chou"],bonne:0,expl:"Exception : chou prend un x → choux (comme bijou, caillou, genou…)."},
{id:"af30",matiere:"francais",niveau:"facile",q:"Quel est le pluriel de « tableau » ?",choix:["tableaux","tableaus","tableauxs","tableau"],bonne:0,expl:"Les mots en -eau prennent un x : tableau → tableaux."},
{id:"af31",matiere:"francais",niveau:"moyen",q:"Quel est le pluriel de « souris » ?",choix:["souris","souri","souries","sourix"],bonne:0,expl:"Les mots finissant déjà par s ne changent pas : une souris, des souris."},
{id:"af32",matiere:"francais",niveau:"moyen",q:"Quel est le féminin de « un acteur » ?",choix:["une actrice","une acteuse","une acteure","une actrisse"],bonne:0,expl:"acteur → actrice."},
{id:"af33",matiere:"francais",niveau:"moyen",q:"« Les fleurs sont ___. » (beau)",choix:["belles","beaux","belle","beau"],bonne:0,expl:"« fleurs » est féminin pluriel → « belles »."},
{id:"af34",matiere:"francais",niveau:"moyen",q:"« Les joueurs ___ sur le terrain. » (courir, présent)",choix:["courent","cours","court","courons"],bonne:0,expl:"Sujet pluriel (ils) → « courent »."},
{id:"af35",matiere:"francais",niveau:"facile",q:"« vite » est…",choix:["un adverbe","un nom","un verbe","un adjectif"],bonne:0,expl:"« vite » dit COMMENT on fait : c'est un adverbe."},
{id:"af36",matiere:"francais",niveau:"facile",q:"« rouge » est…",choix:["un adjectif","un nom","un adverbe","un verbe"],bonne:0,expl:"« rouge » décrit un nom (un maillot rouge) : c'est un adjectif."},
{id:"af37",matiere:"francais",niveau:"facile",q:"« maison » est…",choix:["un nom","un verbe","un adjectif","un adverbe"],bonne:0,expl:"« maison » désigne une chose : c'est un nom."},
{id:"af38",matiere:"francais",niveau:"facile",q:"« courir » est…",choix:["un verbe","un nom","un adjectif","un adverbe"],bonne:0,expl:"« courir » est une action : c'est un verbe (à l'infinitif)."},
{id:"af39",matiere:"francais",niveau:"facile",q:"Dans « le ballon », le mot « le » est…",choix:["un déterminant","un nom","un verbe","un adverbe"],bonne:0,expl:"« le, la, un, des »… se mettent devant un nom : ce sont des déterminants."},
{id:"af40",matiere:"francais",niveau:"moyen",q:"Dans « il marque un but », le mot « il » est…",choix:["un pronom","un nom","un verbe","un adjectif"],bonne:0,expl:"« il » remplace un nom : c'est un pronom (personnel)."},
{id:"af41",matiere:"francais",niveau:"facile",q:"« Quelle belle action ! » est une phrase…",choix:["exclamative","interrogative","impérative","déclarative"],bonne:0,expl:"Elle exprime un sentiment et finit par « ! » : phrase exclamative."},
{id:"af42",matiere:"francais",niveau:"facile",q:"« Tu viens jouer ? » est une phrase…",choix:["interrogative","exclamative","impérative","déclarative"],bonne:0,expl:"Elle pose une question et finit par « ? » : phrase interrogative."},
{id:"af43",matiere:"francais",niveau:"facile",q:"Quel signe met-on à la fin d'une question ?",choix:["?","!",".",","],bonne:0,expl:"Une question se termine par un point d'interrogation « ? »."},
{id:"af44",matiere:"francais",niveau:"facile",q:"Dans « Le chat dort », le sujet est…",choix:["le chat","dort","le","chat dort"],bonne:0,expl:"Le sujet fait l'action : QUI dort ? Le chat."},
{id:"af45",matiere:"francais",niveau:"facile",q:"Ce mot est-il bien orthographié : « beaucoup » ?",choix:["Oui","Non"],bonne:0,expl:"Oui : « beaucoup » (avec eau et un p à la fin)."},
{id:"af46",matiere:"francais",niveau:"facile",q:"Ce mot est-il bien orthographié : « toujours » ?",choix:["Oui","Non"],bonne:0,expl:"Oui : « toujours » prend un s à la fin."},
{id:"af47",matiere:"francais",niveau:"facile",q:"Ce mot est-il bien orthographié : « beacoup » ?",choix:["Oui","Non"],bonne:1,expl:"Non : il manque une lettre. On écrit « beaucoup »."},
{id:"af48",matiere:"francais",niveau:"facile",q:"Ce mot est-il bien orthographié : « toujour » ?",choix:["Oui","Non"],bonne:1,expl:"Non : il faut un s à la fin → « toujours »."},
{id:"af49",matiere:"francais",niveau:"facile",q:"Ce mot est-il bien orthographié : « femme » ?",choix:["Oui","Non"],bonne:0,expl:"Oui : « femme » (on l'écrit avec e-m-m même si on entend « fam »)."},
{id:"af50",matiere:"francais",niveau:"facile",q:"Ce mot est-il bien orthographié : « aujourd'hui » ?",choix:["Oui","Non"],bonne:0,expl:"Oui, avec l'apostrophe : aujourd'hui."},
{id:"af51",matiere:"francais",niveau:"facile",q:"Ce mot est-il bien orthographié : « maison » ?",choix:["Oui","Non"],bonne:0,expl:"Oui : « maison » (m-a-i-s-o-n)."},

{id:"fm5",matiere:"maths",titre:"Les nombres décimaux",sections:[
 {t:"Lire un décimal",c:"Après la virgule : le 1ᵉʳ chiffre = <span class='hl-ma'>dixièmes</span>, le 2ᵉ = <span class='hl-ma'>centièmes</span>.<div class='ex'>12,05 → 0 dixième et 5 centièmes</div>"},
 {t:"Fractions ↔ décimaux",c:"<div class='ex'>1/2 = 0,5<br>1/4 = 0,25<br>3/4 = 0,75<br>3/10 = 0,3</div>"},
 {t:"Comparer",c:"On met le même nombre de chiffres après la virgule.<div class='ex'>0,7 = 0,70. Or 70 > 65, donc <b>0,7 > 0,65</b></div>"}
]},

/* ===== FRANÇAIS ===== */
{id:"ff1",matiere:"francais",titre:"Les homophones",sections:[
 {t:"a / à",c:"<span class='hl-fr'>a</span> = verbe avoir (on peut dire « avait »). <span class='hl-fr'>à</span> = petit mot de lieu/direction.<div class='ex'>Il <b>a</b> faim. — Je vais <b>à</b> l'école.</div>"},
 {t:"et / est",c:"<span class='hl-fr'>et</span> relie (= « puis »). <span class='hl-fr'>est</span> = verbe être (= « était »).<div class='ex'>un chien <b>et</b> un chat — il <b>est</b> content</div>"},
 {t:"on / ont · son / sont",c:"<span class='hl-fr'>ont</span> et <span class='hl-fr'>sont</span> = verbes (avaient / étaient).<div class='ex'>Ils <b>ont</b> gagné. — Ils <b>sont</b> là. — <b>On</b> joue. — <b>Son</b> ballon.</div>"},
 {t:"ou / où",c:"<span class='hl-fr'>où</span> = le lieu. <span class='hl-fr'>ou</span> = un choix.<div class='ex'><b>Où</b> es-tu ? — thé <b>ou</b> café ?</div>"}
]},
{id:"ff2",matiere:"francais",titre:"Le présent des verbes",sections:[
 {t:"Verbes en -er",c:"je -e, tu -es, il -e, nous -ons, vous -ez, ils -ent.<div class='ex'>jouer → je joue, nous jouons, ils jouent</div>"},
 {t:"Verbes utiles à connaître",c:"<div class='ex'>être → je suis, il est, ils sont<br>avoir → j'ai, il a, ils ont<br>aller → je vais, tu vas, il va<br>faire → nous faisons, vous faites</div>"},
 {t:"Petit piège",c:"À la 3ᵉ personne, beaucoup de verbes prennent un <span class='hl-fr'>t</span> : il vien<b>t</b>, il pren<b>d</b>, il fai<b>t</b>."}
]},
{id:"ff3",matiere:"francais",titre:"Le pluriel des noms",sections:[
 {t:"La règle générale",c:"On ajoute un <span class='hl-fr'>s</span>.<div class='ex'>un ballon → des ballon<b>s</b></div>"},
 {t:"Les cas particuliers",c:"En <span class='hl-fr'>-eau</span> et <span class='hl-fr'>-eu</span> → x (tableau → tableaux, jeu → jeux). En <span class='hl-fr'>-al</span> → -aux (cheval → chevaux).<div class='ex'>Déjà en s, x ou z : ça ne change pas. une souris → des souris</div>"}
]},
{id:"ff4",matiere:"francais",titre:"La nature des mots",sections:[
 {t:"Les principales",c:"<span class='hl-fr'>nom</span> (maison), <span class='hl-fr'>verbe</span> (courir), <span class='hl-fr'>adjectif</span> (rouge), <span class='hl-fr'>adverbe</span> (vite), <span class='hl-fr'>déterminant</span> (le, un, mon), <span class='hl-fr'>pronom</span> (il, elle, je)."},
 {t:"Comment reconnaître",c:"Le <b>nom</b> a souvent un petit mot devant (le, un…). Le <b>verbe</b> se conjugue (hier, aujourd'hui…). L'<b>adjectif</b> décrit un nom.<div class='ex'>Le (dét.) grand (adj.) joueur (nom) court (verbe) vite (adv.).</div>"}
]},
{id:"ff5",matiere:"francais",titre:"Les types de phrases",sections:[
 {t:"Les 4 types",c:"<span class='hl-fr'>déclarative</span> : on raconte (.). <span class='hl-fr'>interrogative</span> : on demande (?). <span class='hl-fr'>exclamative</span> : on s'exclame (!). <span class='hl-fr'>impérative</span> : on donne un ordre.<div class='ex'>Il joue. — Tu viens ? — Quel but ! — Passe le ballon.</div>"},
 {t:"La ponctuation",c:"<b>.</b> fin de phrase — <b>?</b> question — <b>!</b> exclamation — <b>,</b> petite pause."}
]},

/* ===== ANGLAIS ===== */
{id:"fa1",matiere:"anglais",titre:"To be (am / is / are)",sections:[
 {t:"Les 3 formes",c:"<span class='hl-an'>I am</span> — <span class='hl-an'>he/she/it is</span> — <span class='hl-an'>you/we/they are</span>.<div class='ex'>I am Ace. — She is happy. — They are friends.</div>"},
 {t:"Avec l'âge",c:"En anglais on <b>est</b> âgé (pas « on a »).<div class='ex'>I <b>am</b> ten years old. (= j'ai 10 ans)</div>"}
]},
{id:"fa2",matiere:"anglais",titre:"Les nombres et les couleurs",sections:[
 {t:"Nombres 1 à 10",c:"<div class='ex'>one, two, three, four, five, six, seven, eight, nine, ten</div>"},
 {t:"Couleurs",c:"<span class='hl-an'>red</span> (rouge), <span class='hl-an'>blue</span> (bleu), <span class='hl-an'>green</span> (vert), <span class='hl-an'>yellow</span> (jaune), <span class='hl-an'>black</span> (noir), <span class='hl-an'>white</span> (blanc)."}
]},
{id:"fa3",matiere:"anglais",titre:"Les jours de la semaine",sections:[
 {t:"Les 7 jours",c:"<div class='ex'>Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday</div>"},
 {t:"À retenir",c:"En anglais, les jours prennent toujours une <span class='hl-an'>majuscule</span>."}
]},
{id:"fa4",matiere:"anglais",titre:"Se présenter",sections:[
 {t:"Les questions clés",c:"<span class='hl-an'>What is your name ?</span> (ton nom) — <span class='hl-an'>How are you ?</span> (ça va) — <span class='hl-an'>How old are you ?</span> (ton âge)."},
 {t:"Les réponses",c:"<div class='ex'>My name is Ace.<br>I am fine, thank you.<br>I am 11 years old.</div>"}
]},
{id:"fa5",matiere:"anglais",titre:"Vocabulaire de base + a / an",sections:[
 {t:"a ou an ?",c:"<span class='hl-an'>a</span> devant une consonne, <span class='hl-an'>an</span> devant un son voyelle (a, e, i, o, u).<div class='ex'>a dog — a book — an apple — an orange</div>"},
 {t:"Petits mots utiles",c:"<span class='hl-an'>yes</span> (oui) / <span class='hl-an'>no</span> (non), <span class='hl-an'>hello</span> (bonjour), <span class='hl-an'>goodbye</span> (au revoir), <span class='hl-an'>please</span> (s'il te plaît), <span class='hl-an'>thank you</span> (merci)."}
]},
/* ===== MATHS : LA GRANDE FICHE DIVISIONS ===== */
{id:"fm6",matiere:"maths",titre:"Les divisions (fiche complète)",sections:[
 {t:"1. Diviser, ça veut dire quoi ?",c:"Diviser, c'est <span class='hl-ma'>partager en parts égales</span>, ou chercher <span class='hl-ma'>combien de fois</span> un nombre tient dans un autre.<div class='fig'><svg viewBox='0 0 300 110'><g><rect x='6' y='20' width='86' height='70' rx='10' fill='#DCEAF6' stroke='#164a86'/><rect x='107' y='20' width='86' height='70' rx='10' fill='#DCEAF6' stroke='#164a86'/><rect x='208' y='20' width='86' height='70' rx='10' fill='#DCEAF6' stroke='#164a86'/><g fill='#2F6DB0'><circle cx='30' cy='42' r='7'/><circle cx='68' cy='42' r='7'/><circle cx='30' cy='70' r='7'/><circle cx='68' cy='70' r='7'/><circle cx='131' cy='42' r='7'/><circle cx='169' cy='42' r='7'/><circle cx='131' cy='70' r='7'/><circle cx='169' cy='70' r='7'/><circle cx='232' cy='42' r='7'/><circle cx='270' cy='42' r='7'/><circle cx='232' cy='70' r='7'/><circle cx='270' cy='70' r='7'/></g></g></svg></div>12 billes partagées en 3 boîtes → <b>12 ÷ 3 = 4</b> billes par boîte."},
 {t:"2. Le vocabulaire",c:"Dans <b>96 ÷ 4 = 24</b> : <span class='hl-ma'>96</span> est le <b>dividende</b> (ce qu'on partage), <span class='hl-ma'>4</span> le <b>diviseur</b> (en combien de parts), <span class='hl-ok'>24</span> le <b>quotient</b> (le résultat). Ce qui reste s'appelle le <b>reste</b>."},
 {t:"3. La division posée (la potence)",c:"On divise chiffre par chiffre, de <span class='hl-ma'>gauche à droite</span>.<div class='fig'><svg viewBox='0 0 210 150'><line x1='108' y1='10' x2='108' y2='135' stroke='#164a86' stroke-width='2'/><line x1='108' y1='40' x2='190' y2='40' stroke='#164a86' stroke-width='2'/><text x='96' y='30' text-anchor='end' font-size='17' fill='#24262C'>96</text><text x='150' y='30' text-anchor='middle' font-size='17' fill='#164a86'>4</text><text x='150' y='64' text-anchor='middle' font-size='17' fill='#2E8B57'>24</text><text x='96' y='58' text-anchor='end' font-size='15' fill='#A5243D'>−8</text><line x1='60' y1='66' x2='100' y2='66' stroke='#7c7566'/><text x='96' y='84' text-anchor='end' font-size='15' fill='#24262C'>16</text><text x='96' y='106' text-anchor='end' font-size='15' fill='#A5243D'>−16</text><line x1='55' y1='114' x2='100' y2='114' stroke='#7c7566'/><text x='96' y='132' text-anchor='end' font-size='15' fill='#24262C'>0</text></svg></div><div class='calc'><div class='cl'>Dans 9, combien de fois 4 ? → 2 <span class='cw'>2 × 4 = 8</span></div><div class='cl'>9 − 8 = 1, j'abaisse le 6 → 16 <span class='cw'>on descend le chiffre suivant</span></div><div class='cl'>Dans 16, combien de fois 4 ? → 4 <span class='cw'>4 × 4 = 16</span></div><div class='cl'>16 − 16 = 0 → <b>quotient 24, reste 0</b></div></div>"},
 {t:"4. Une division avec un reste",c:"<div class='calc'><div class='cl'>74 ÷ 5 <span class='cw'>on partage 74 en 5</span></div><div class='cl'>Dans 7, combien de fois 5 ? → 1 (5), reste 2</div><div class='cl'>j'abaisse le 4 → 24 ; dans 24, combien de fois 5 ? → 4 (20)</div><div class='cl'>24 − 20 = 4 → <b>74 = 5 × 14 + 4</b> (quotient 14, reste 4)</div></div>Le <span class='hl-ma'>reste est toujours plus petit que le diviseur</span>."},
 {t:"5. La division euclidienne",c:"On peut toujours écrire : <span class='hl-ma'>dividende = diviseur × quotient + reste</span>.<div class='ex'>74 = 5 × 14 + 4 ✔</div>C'est aussi la façon de <b>vérifier</b> sa division !"},
 {t:"6. Diviser par 10, par 100",c:"On <span class='hl-ma'>décale la virgule</span> vers la gauche.<div class='calc'><div class='cl'>320 ÷ 10 = 32</div><div class='cl'>320 ÷ 100 = 3,2</div><div class='cl'>45 ÷ 10 = 4,5</div></div>"},
 {t:"7. L'astuce : penser aux tables",c:"Une division, c'est une multiplication à l'envers.<div class='ex'>56 ÷ 7 = ? → « 7 × combien = 56 ? » → 8. Donc 56 ÷ 7 = <b>8</b>.</div>Bien connaître ses tables rend les divisions faciles."}
]},

/* ===== HISTOIRE-GÉO (6) ===== */
{id:"hg1",matiere:"histoire",titre:"Les grandes périodes de l'histoire",sections:[
 {t:"La frise du temps",c:"On classe le temps en grandes périodes.<div class='fig'><svg viewBox='0 0 320 100'><rect x='10' y='35' width='86' height='28' fill='#e5cfa9' stroke='#7d5320'/><rect x='96' y='35' width='52' height='28' fill='#d8b98a' stroke='#7d5320'/><rect x='148' y='35' width='52' height='28' fill='#e5cfa9' stroke='#7d5320'/><rect x='200' y='35' width='46' height='28' fill='#d8b98a' stroke='#7d5320'/><rect x='246' y='35' width='64' height='28' fill='#B5793C' stroke='#7d5320'/><g font-size='8' fill='#5b3f18' text-anchor='middle'><text x='53' y='78'>Préhistoire</text><text x='122' y='78'>Antiquité</text><text x='174' y='78'>Moyen Âge</text><text x='223' y='78'>Temps mod.</text><text x='278' y='78'>Aujourd.</text></g></svg></div>"},
 {t:"À retenir",c:"L'<span class='hl-hg'>écriture</span> marque le début de l'Histoire. Avant, c'est la <b>Préhistoire</b> (les premiers hommes)."}
]},
{id:"hg2",matiere:"histoire",titre:"L'Antiquité : Gaulois et Romains",sections:[
 {t:"Nos ancêtres",c:"En Gaule vivaient les <span class='hl-hg'>Gaulois</span>. Les <span class='hl-hg'>Romains</span>, venus d'Italie, ont conquis la Gaule et apporté leurs villes, leurs routes et leur langue (le latin)."},
 {t:"À retenir",c:"Le latin est l'ancêtre du français. Les Romains ont construit des <b>aqueducs</b>, des <b>arènes</b> et des routes pavées."}
]},
{id:"hg3",matiere:"histoire",titre:"Le Moyen Âge",sections:[
 {t:"Le château fort",c:"Au Moyen Âge, les seigneurs vivaient dans des <span class='hl-hg'>châteaux forts</span> pour se protéger.<div class='fig'><svg viewBox='0 0 220 130'><rect x='40' y='55' width='140' height='60' fill='#d8b98a' stroke='#7d5320'/><g fill='#d8b98a' stroke='#7d5320'><rect x='40' y='40' width='16' height='16'/><rect x='72' y='40' width='16' height='16'/><rect x='104' y='40' width='16' height='16'/><rect x='136' y='40' width='16' height='16'/><rect x='164' y='40' width='16' height='16'/></g><rect x='30' y='30' width='26' height='85' fill='#c9a978' stroke='#7d5320'/><rect x='164' y='30' width='26' height='85' fill='#c9a978' stroke='#7d5320'/><rect x='96' y='78' width='28' height='37' fill='#5b3f18'/></svg></div>"},
 {t:"À retenir",c:"On y trouvait des <span class='hl-hg'>chevaliers</span>, des remparts, un pont-levis et des douves (l'eau autour)."}
]},
{id:"hg4",matiere:"histoire",titre:"Continents et océans",sections:[
 {t:"Se repérer sur la Terre",c:"Il y a <span class='hl-hg'>6 continents</span> et <span class='hl-hg'>5 océans</span>.<div class='fig'><svg viewBox='0 0 320 160'><rect x='0' y='0' width='320' height='160' fill='#cfe0ef'/><path d='M40 40 Q70 30 72 68 Q58 95 44 90 Q26 66 40 40 Z' fill='#B5793C'/><path d='M66 100 Q90 96 86 134 Q72 152 62 144 Q52 116 66 100 Z' fill='#B5793C'/><path d='M150 45 Q172 42 172 64 Q162 78 150 74 Q140 60 150 45 Z' fill='#d8b98a'/><path d='M150 82 Q178 82 176 126 Q160 150 146 136 Q136 104 150 82 Z' fill='#B5793C'/><path d='M215 45 Q285 36 288 78 Q268 106 230 92 Q206 74 215 45 Z' fill='#d8b98a'/><ellipse cx='285' cy='128' rx='16' ry='9' fill='#B5793C'/><g font-size='8' fill='#5b3f18'><text x='36' y='66'>Amériques</text><text x='150' y='64'>Europe</text><text x='150' y='118'>Afrique</text><text x='240' y='72'>Asie</text></g></svg></div>"}
]},
{id:"hg5",matiere:"histoire",titre:"La France",sections:[
 {t:"L'Hexagone et ses fleuves",c:"La France a la forme d'un <span class='hl-hg'>hexagone</span>. Ses grands fleuves : la Seine, la Loire, la Garonne, le Rhône.<div class='fig'><svg viewBox='0 0 200 200'><polygon points='100,15 175,60 165,150 100,185 35,150 25,60' fill='#F2E7D6' stroke='#7d5320' stroke-width='2'/><path d='M100 85 Q90 65 72 52' fill='none' stroke='#2F6DB0' stroke-width='2'/><path d='M60 118 Q100 105 150 112' fill='none' stroke='#2F6DB0' stroke-width='2'/><path d='M140 92 Q150 130 150 162' fill='none' stroke='#2F6DB0' stroke-width='2'/><circle cx='100' cy='88' r='3.5' fill='#A5243D'/><text x='106' y='86' font-size='9' fill='#5b3f18'>Paris</text></svg></div>"},
 {t:"À retenir",c:"La capitale est <span class='hl-hg'>Paris</span>, traversée par la Seine. La France est en Europe."}
]},
{id:"hg6",matiere:"histoire",titre:"Les points cardinaux",sections:[
 {t:"La rose des vents",c:"Pour se repérer : <span class='hl-hg'>Nord</span>, <span class='hl-hg'>Sud</span>, <span class='hl-hg'>Est</span>, <span class='hl-hg'>Ouest</span>. Sur une carte, le Nord est en haut.<div class='fig'><svg viewBox='0 0 160 160'><circle cx='80' cy='80' r='60' fill='#F2E7D6' stroke='#7d5320'/><polygon points='80,20 88,80 72,80' fill='#A5243D'/><polygon points='80,140 88,80 72,80' fill='#7d5320'/><polygon points='20,80 80,72 80,88' fill='#7d5320'/><polygon points='140,80 80,72 80,88' fill='#7d5320'/><g font-size='13' fill='#5b3f18' text-anchor='middle'><text x='80' y='16'>N</text><text x='80' y='154'>S</text><text x='10' y='85'>O</text><text x='150' y='85'>E</text></g></svg></div>"}
]},

/* ===== SCIENCES (6) ===== */
{id:"sc1",matiere:"sciences",titre:"Le vivant et ses besoins",sections:[
 {t:"Vivant ou non ?",c:"Un être <span class='hl-sc'>vivant</span> naît, grandit, se nourrit, se reproduit et meurt (un animal, une plante). Une pierre ou un vélo sont <b>non vivants</b>."},
 {t:"Les besoins",c:"Pour vivre, les animaux ont besoin de <span class='hl-sc'>nourriture</span>, d'<span class='hl-sc'>eau</span>, d'<span class='hl-sc'>air</span> et d'un abri. Les plantes ont besoin d'eau, de lumière et d'air."}
]},
{id:"sc2",matiere:"sciences",titre:"Le squelette et les muscles",sections:[
 {t:"Pour tenir et bouger",c:"Le <span class='hl-sc'>squelette</span> (les os) soutient le corps et le protège. Les <span class='hl-sc'>muscles</span>, attachés aux os, se contractent pour faire bouger les articulations."},
 {t:"À retenir",c:"Le crâne protège le <b>cerveau</b>, les côtes protègent le <b>cœur</b> et les <b>poumons</b>."}
]},
{id:"sc3",matiere:"sciences",titre:"Les états de l'eau",sections:[
 {t:"Solide, liquide, gaz",c:"L'eau peut être <span class='hl-sc'>solide</span> (glace), <span class='hl-sc'>liquide</span> ou <span class='hl-sc'>gazeuse</span> (vapeur).<div class='fig'><svg viewBox='0 0 300 120'><rect x='12' y='20' width='80' height='80' rx='8' fill='#E9E2F7' stroke='#4a3488'/><rect x='30' y='45' width='44' height='30' fill='#7A5AC2'/><text x='52' y='114' text-anchor='middle' font-size='11' fill='#4a3488'>glace</text><rect x='110' y='20' width='80' height='80' rx='8' fill='#E9E2F7' stroke='#4a3488'/><path d='M124 60 Q150 50 176 60 L176 90 L124 90 Z' fill='#7A5AC2'/><text x='150' y='114' text-anchor='middle' font-size='11' fill='#4a3488'>eau</text><rect x='208' y='20' width='80' height='80' rx='8' fill='#E9E2F7' stroke='#4a3488'/><g fill='#7A5AC2'><circle cx='230' cy='45' r='5'/><circle cx='262' cy='40' r='5'/><circle cx='248' cy='66' r='5'/><circle cx='272' cy='72' r='5'/></g><text x='248' y='114' text-anchor='middle' font-size='11' fill='#4a3488'>vapeur</text></svg></div>"},
 {t:"Les changements",c:"La glace <span class='hl-sc'>fond</span> (fusion) à 0 °C ; l'eau <span class='hl-sc'>s'évapore</span> quand on la chauffe (elle bout à 100 °C)."}
]},
{id:"sc4",matiere:"sciences",titre:"Le circuit électrique",sections:[
 {t:"Une boucle fermée",c:"Pour allumer une lampe, il faut une <span class='hl-sc'>pile</span>, des fils et une boucle <span class='hl-sc'>fermée</span>.<div class='fig'><svg viewBox='0 0 260 130'><g stroke='#4a3488' stroke-width='2.5' fill='none' stroke-linecap='round'><polyline points='40,25 112,25'/><polyline points='148,25 220,25'/><polyline points='220,25 220,105 40,105 40,25'/></g><circle cx='130' cy='25' r='15' fill='#E9E2F7' stroke='#4a3488' stroke-width='2.5'/><line x1='120' y1='15' x2='140' y2='35' stroke='#A5243D' stroke-width='2'/><line x1='140' y1='15' x2='120' y2='35' stroke='#A5243D' stroke-width='2'/><line x1='24' y1='55' x2='56' y2='55' stroke='#4a3488' stroke-width='2'/><line x1='32' y1='68' x2='48' y2='68' stroke='#4a3488' stroke-width='5'/><text x='40' y='95' text-anchor='middle' font-size='10' fill='#4a3488'>pile</text><text x='130' y='60' text-anchor='middle' font-size='10' fill='#4a3488'>lampe</text></svg></div>"},
 {t:"À retenir",c:"Si on ouvre l'interrupteur (on coupe la boucle), la lampe <b>s'éteint</b>."}
]},
{id:"sc5",matiere:"sciences",titre:"La Terre, le Soleil et la Lune",sections:[
 {t:"Le jour et la nuit",c:"La Terre <span class='hl-sc'>tourne sur elle-même</span> en 24 h : le côté éclairé par le Soleil est en <b>jour</b>, l'autre en <b>nuit</b>.<div class='fig'><svg viewBox='0 0 300 130'><circle cx='40' cy='65' r='22' fill='#E9B84A' stroke='#4a3488'/><g stroke='#E9B84A' stroke-width='2'><line x1='68' y1='65' x2='110' y2='65'/><line x1='62' y1='46' x2='100' y2='34'/><line x1='62' y1='84' x2='100' y2='96'/></g><circle cx='180' cy='65' r='32' fill='#1c2b52'/><path d='M180 33 A32 32 0 0 0 180 97 Z' fill='#E9B84A'/><circle cx='180' cy='65' r='32' fill='none' stroke='#4a3488'/><text x='160' y='69' text-anchor='middle' font-size='10' fill='#4a3488'>jour</text><text x='202' y='69' text-anchor='middle' font-size='10' fill='#fff'>nuit</text><circle cx='265' cy='38' r='10' fill='#E9E2F7' stroke='#4a3488'/></svg></div>"},
 {t:"À retenir",c:"La Terre tourne autour du <span class='hl-sc'>Soleil</span> en 1 an (les saisons). La Lune tourne autour de la Terre."}
]},

/* ================= DATES ================= */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayFromIndex(i){ const d=new Date(START); d.setDate(START.getDate()+i); return d; }
function midnight(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function todayIndex(){
  const t=midnight(new Date());
  const diff=Math.round((t-START)/86400000);
  return diff; // <0 avant le 3 août, >28 après le 31
}
const JOURS_FR=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS_FR=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function dateLisible(d){ return JOURS_FR[d.getDay()]+" "+d.getDate()+" "+MOIS_FR[d.getMonth()]; }

/* ================= PRNG déterministe (par jour) ================= */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, rnd){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hashStr(s){ let h=0; for(let k=0;k<s.length;k++){ h=(h*31+s.charCodeAt(k))|0; } return h>>>0; }
function melangeChoix(q, i){
  const rnd=mulberry32((20260803 + i*97 + hashStr(q.id))>>>0);
  const idx=q.choix.map((_,k)=>k);
  for(let k=idx.length-1;k>0;k--){ const j=Math.floor(rnd()*(k+1)); [idx[k],idx[j]]=[idx[j],idx[k]]; }
  return Object.assign({}, q, { choix: idx.map(k=>q.choix[k]), bonne: idx.indexOf(q.bonne) });
}

/* ================= PLAN DU JOUR ================= */
function semaine(i){ return i<7?1 : i<14?2 : i<21?3 : 4; }
function nbQuestions(i){ const s=semaine(i); return s===1?20 : s===2?25 : 30; }

// répartition des niveaux par semaine ; plus on avance, plus de questions difficiles
function poidsNiveaux(i){
  const s=semaine(i);
  if(s===1) return {facile:0.80, moyen:0.20, difficile:0};
  if(s===2) return {facile:0.55, moyen:0.35, difficile:0.10};
  if(s===3) return {facile:0.35, moyen:0.45, difficile:0.20};
  const k=Math.min(i-21,7);
  const difficile=0.25+0.025*k;
  return {facile:0.15, moyen:1-0.15-difficile, difficile:difficile};
}

function repartitionMatieres(n, i){
  const ma=Math.round(n*0.5), fr=Math.round(n*0.4), an=n-ma-fr;
  let hi=0, sc=0, em=0;
  if(semaine(i)>=2){ hi=5; sc=5; em=3; }   // AJOUTÉES en plus dès la semaine 2
  return {francais:fr, maths:ma, anglais:an, histoire:hi, sciences:sc, emc:em};
}
function totalQuestions(i){ const r=repartitionMatieres(nbQuestions(i), i); return Object.values(r).reduce((a,b)=>a+b,0); }

// répartit "count" questions d'une matière selon les poids de niveaux
function tirerMatiere(matiere, count, poids, rnd, dejaPris){
  const res=[];
  const parNiveau={
    facile:Math.round(count*poids.facile),
    moyen:Math.round(count*poids.moyen),
    difficile:count
  };
  parNiveau.difficile=Math.max(0,count-parNiveau.facile-parNiveau.moyen);
  const ordre=["facile","moyen","difficile"];
  for(const niv of ordre){
    let besoin=parNiveau[niv];
    if(besoin<=0) continue;
    let pool=BANQUE.filter(q=>q.matiere===matiere && q.niveau===niv && !dejaPris.has(q.id));
    pool=shuffle(pool, rnd);
    for(let k=0;k<pool.length && besoin>0;k++){ res.push(pool[k]); dejaPris.add(pool[k].id); besoin--; }
  }
  // complément si manque (on pioche dans la matière, tout niveau)
  if(res.length<count){
    let pool=shuffle(BANQUE.filter(q=>q.matiere===matiere && !dejaPris.has(q.id)), rnd);
    for(let k=0;k<pool.length && res.length<count;k++){ res.push(pool[k]); dejaPris.add(pool[k].id); }
  }
  return res;
}

function planDuJour(i){
  const rnd=mulberry32(20260803+i*97);
  const n=nbQuestions(i);
  const rep=repartitionMatieres(n,i);
  const totalQ=Object.values(rep).reduce((a,b)=>a+b,0);
  const poids=poidsNiveaux(i);
  const dejaPris=new Set();
  let liste=[];

  // 1) questions de révision dues (erreurs passées + notions importantes)
  const dues=Object.keys(STATE.review).filter(id=>STATE.review[id].due<=i && BANQUE.some(q=>q.id===id));
  const maxRev=Math.floor(totalQ*0.25);
  const revShuf=shuffle(dues, rnd).slice(0,maxRev);
  for(const id of revShuf){ const q=BANQUE.find(x=>x.id===id); if(q){ liste.push(q); dejaPris.add(id); } }

  // 2) on complète chaque matière (en retirant ce que la révision a déjà mis)
  const compteRev={francais:0,maths:0,anglais:0,histoire:0,sciences:0,emc:0};
  liste.forEach(q=>compteRev[q.matiere]++);
  for(const m of ["francais","maths","anglais","histoire","sciences","emc"]){
    const reste=Math.max(0, rep[m]-compteRev[m]);
    if(reste>0) liste=liste.concat(tirerMatiere(m, reste, poids, rnd, dejaPris));
  }
  // 3) mélange final stable
  liste=shuffle(liste, rnd).slice(0,totalQ);
  liste=liste.map(q=>melangeChoix(q, i));
  return liste;
}

/* ================= MISE À JOUR RÉVISION ================= */
function majRevision(q, correct, i){
  const r=STATE.review;
  if(!correct){
    r[q.id]={due:i+1, streak:0}; // à revoir dès demain
  } else {
    if(r[q.id]){ // était en révision : on espace
      const st=(r[q.id].streak||0)+1;
      if(st>=3){ delete r[q.id]; }
      else { r[q.id]={due:i+[0,2,4][st], streak:st}; }
    } else if(q.important){ // notion importante : on la repose même si juste
      r[q.id]={due:i+2, streak:1};
    }
  }
}

/* ================= STATUT D'UN JOUR ================= */
function statutJour(i){
  const key=ymd(dayFromIndex(i));
  const ti=todayIndex();
  if(STATE.notes[key]) return "done";
  if(i>ti) return "lock";
  if(i===ti) return "todo";
  return "late"; // passé non fait
}

  html+=`</div>`;

}

function renderSuivi(){
  const el=document.getElementById("sec-suivi");
  const keys=Object.keys(STATE.notes).sort();
  let html=`<h2>Ton suivi</h2>`;
  if(keys.length===0){ html+=`<p class="emptynote">Pas encore de note. Joue ton premier match et ta note s'affichera ici ⚽</p>`; el.innerHTML=html; return; }
  const notes=keys.map(k=>STATE.notes[k].note);
  const moy=notes.reduce((a,b)=>a+b,0)/notes.length;
  const best=Math.max(...notes);
  html+=`<div class="stat">
    <div class="b"><div class="k">Moyenne</div><div class="val">${moy.toFixed(1)}</div></div>
    <div class="b"><div class="k">Meilleure</div><div class="val">${best.toFixed(1)}</div></div>
    <div class="b"><div class="k">Matchs joués</div><div class="val">${keys.length}</div></div>
  </div>`;
  keys.forEach(k=>{
    const nd=STATE.notes[k];
    const d=new Date(k+"T00:00:00");

  });
  el.innerHTML=html;
}

/* ================= FICHE READER ================= */
function ouvrirFiche(id){
  const f=FICHES.find(x=>x.id===id); if(!f) return;
  const cls=MAT[f.matiere].cls;
  let html=`<div class="qtag ${cls}">${MAT[f.matiere].ic} ${MAT[f.matiere].nom}</div>`;
  html+=`<div class="fiche-h" style="color:var(--${cls}-d)">${f.titre}</div>`;
  f.sections.forEach(s=>{
    html+=`<div class="fiche-sec"><div class="st" style="color:var(--${cls}-d)">${s.t}</div><div>${s.c}</div></div>`;
  });
  const lu=STATE.fiches[id];
  html+=`<div class="readbox ${lu?'checked':''}" id="readBox"><div class="box">${lu?'✓':''}</div><div>${lu?"C'est lu, bravo ACE ! ⚽":"J'ai lu cette fiche"}</div></div>`;
  document.getElementById("fBody").innerHTML=html;
  document.getElementById("readBox").onclick=()=>{
    STATE.fiches[id]=!STATE.fiches[id]; save(STATE); ouvrirFiche(id); renderFiches(); renderAccueil();
  };
  document.getElementById("ficheView").classList.add("on");
  window.scrollTo(0,0);
}
document.getElementById("fClose").onclick=()=>document.getElementById("ficheView").classList.remove("on");

  el.querySelectorAll("[data-refaire]").forEach(b=>b.onclick=()=>lancerDictee(+b.dataset.refaire,true));
}
function lancerDictee(sem,refaire){
  const d=DICTEES.find(x=>x.sem===sem); if(!d) return;
  DCUR={sem:sem,fautes:0,refaire:refaire};
  const phrases=(d.texte.match(/[^.!?]+[.!?]*/g)||[d.texte]).map(s=>s.trim()).filter(Boolean);
  let html=`<div class="qtag hg">🎤 ${d.titre}</div>`;
  html+=`<p class="mini"><b>Adulte :</b> lis les phrases à voix haute, une par une. Points à surveiller : ${d.vigilance}</p>`;
  html+=`<div class="dictee-texte-lire">`;
  phrases.forEach((ph,idx)=>{ html+=`<div class="dphrase"><span>${ph}</span><button class="mini-listen" data-say="${idx}">🔊</button></div>`; });
  html+=`</div>`;
  html+=`<div class="card"><div class="lbl">Nombre de fautes</div><div class="fautes-row"><button class="fbtn" id="fMoins">−</button><div class="fnum" id="fNum">0</div><button class="fbtn" id="fPlus">+</button></div><button class="btn btn-ok" id="dSave">Enregistrer le résultat</button></div>`;
  document.getElementById("dBody").innerHTML=html;
  document.getElementById("dicteeView").classList.add("on");
  window.scrollTo(0,0);
  document.getElementById("fMoins").onclick=()=>{DCUR.fautes=Math.max(0,DCUR.fautes-1);document.getElementById("fNum").textContent=DCUR.fautes;};
  document.getElementById("fPlus").onclick=()=>{DCUR.fautes++;document.getElementById("fNum").textContent=DCUR.fautes;};
  document.getElementById("dSave").onclick=sauverDictee;
  document.querySelectorAll("#dBody [data-say]").forEach(b=>b.onclick=()=>parlerFr(phrases[+b.dataset.say]));
}
function sauverDictee(){
  if(!(DCUR.refaire && STATE.dictees[DCUR.sem])){ STATE.dictees[DCUR.sem]={fautes:DCUR.fautes,done:true}; save(STATE); }
  document.getElementById("dicteeView").classList.remove("on");
  renderDictee();
}
document.getElementById("dClose").onclick=()=>document.getElementById("dicteeView").classList.remove("on");

/* ================= QCM ================= */
let Q={ liste:[], idx:0, correct:0, jour:0, demo:false, faux:[] };

function lancerQCM(i){
  Q={ liste:planDuJour(i), idx:0, correct:0, jour:i, demo:false, faux:[] };
  if(Q.liste.length===0){ alert("Aucune question disponible."); return; }
  document.getElementById("qcm").classList.add("on");
  window.scrollTo(0,0);
  afficherQuestion();
}
function lancerDemo(){
  const rnd=mulberry32(42);
  const dem=[
    BANQUE.filter(q=>q.matiere==="maths"&&q.niveau==="facile"),
    BANQUE.filter(q=>q.matiere==="francais"&&q.niveau==="facile"),
    BANQUE.filter(q=>q.matiere==="anglais"&&q.niveau==="facile")
  ].map(pool=>shuffle(pool,rnd)[0]).filter(Boolean);
  const demMix=dem.map((q,k)=>melangeChoix(q, 900+k));
  Q={ liste:demMix, idx:0, correct:0, jour:-1, demo:true, faux:[] };
  document.getElementById("qcm").classList.add("on"); window.scrollTo(0,0); afficherQuestion();
}

function afficherQuestion(){
  const q=Q.liste[Q.idx];
  const total=Q.liste.length;
  document.getElementById("qProg").style.width=((Q.idx)/total*100)+"%";
  document.getElementById("qCount").textContent=(Q.idx+1)+" / "+total;
  const cls=MAT[q.matiere].cls;
  let html=`<div class="qtag ${cls}">${MAT[q.matiere].ic} ${MAT[q.matiere].nom}</div>`;
  html+=`<div class="qtext">${q.q}</div>`;
  html+=`<div id="opts">`;
  q.choix.forEach((c,k)=>{
    html+=`<button class="opt" data-k="${k}"><span>${c}</span><span class="oic">✓</span></button>`;
  });
  html+=`</div><div id="fbSlot"></div>`;
  const body=document.getElementById("qBody");
  body.innerHTML=html;
  window.scrollTo(0,0);
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>repondre(+b.dataset.k));
}

function repondre(k){
  const q=Q.liste[Q.idx];
  const opts=document.querySelectorAll("#opts .opt");
  opts.forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.bonne){ b.classList.add("correct"); }
    if(idx===k && k!==q.bonne){ b.classList.add("wrong"); b.querySelector(".oic").textContent="✕"; }
  });
  const correct=(k===q.bonne);
  if(correct) Q.correct++; else Q.faux.push(q);
  if(!Q.demo) majRevision(q, correct, Q.jour);

  const enc=correct? ENC_OK[Math.floor(Math.random()*ENC_OK.length)] : ENC_NO[Math.floor(Math.random()*ENC_NO.length)];
  const fb=document.createElement("div");
  fb.className="feedback "+(correct?"good":"bad");
  fb.innerHTML=`<div class="enc">${enc}</div><div class="expl"><b>${correct?'':'La bonne réponse : '+q.choix[q.bonne]+'.<br>'}</b>${q.expl}</div>`;
  document.getElementById("fbSlot").appendChild(fb);

  const next=document.createElement("button");
  next.className="btn btn-fr"; next.style.marginTop="8px";
  next.textContent=(Q.idx+1<Q.liste.length)?"Question suivante ▸":"Voir mon résultat 🎉";
  next.onclick=suivante;
  document.getElementById("fbSlot").appendChild(next);
  fb.scrollIntoView({behavior:"smooth", block:"center"});
}

function suivante(){
  if(Q.idx+1<Q.liste.length){ Q.idx++; afficherQuestion(); }
  else finQCM();
}

function finQCM(){
  const total=Q.liste.length;
  const pct=Math.round(Q.correct/total*100);
  const note=Math.round(Q.correct/total*20*10)/10;
  document.getElementById("qProg").style.width="100%";
  document.getElementById("qCount").textContent=total+" / "+total;

  // 1er score seulement
  if(!Q.demo){
    const key=ymd(dayFromIndex(Q.jour));
    if(!STATE.notes[key]){ STATE.notes[key]={note:note,pct:pct,correct:Q.correct,total:total}; }
    save(STATE);
  }

  let msg = pct>=80?"Match parfait, ACE ! 🏆" : pct>=60?"Beau match, tu progresses ! 💪" : pct>=40?"Bon début, on continue l'entraînement ⚽" : "On révise et on rejoue, tu vas y arriver 💪";
  let html=`<div class="result-score"><div class="note">${note.toFixed(1)}/20</div><div class="pct">${Q.correct} bonnes réponses sur ${total} · ${pct}%</div></div>`;
  html+=`<div class="feedback good" style="text-align:center"><div class="enc">${msg}</div>${Q.demo?'<div class="expl">C\'était un exemple : ça ne compte pas dans ton suivi.</div>':'<div class="expl">Ta note est enregistrée dans l\'onglet Suivi.</div>'}</div>`;

  if(Q.faux.length){
    html+=`<h3 style="margin-top:18px">À revoir tranquillement :</h3>`;
    Q.faux.forEach(q=>{
      html+=`<div class="miss"><div class="mq">${MAT[q.matiere].ic} ${q.q}</div><div class="ma-line">✓ Bonne réponse : ${q.choix[q.bonne]}</div><div class="me-line">${q.expl}</div></div>`;
    });
    html+=`<p class="mini">Ces questions reviendront dans tes prochains QCM pour bien les retenir 👍</p>`;
  } else if(!Q.demo){
    html+=`<div class="card" style="text-align:center">Aucune erreur, match parfait ACE ! 🏆</div>`;
  }
  html+=`<button class="btn btn-ok" id="finBtn" style="margin-top:12px">Terminer</button>`;
  document.getElementById("qBody").innerHTML=html;
  window.scrollTo(0,0);
  document.getElementById("finBtn").onclick=fermerQCM;
}

function fermerQCM(){
  document.getElementById("qcm").classList.remove("on");
  renderAccueil(); renderTest(); renderSuivi();
}
document.getElementById("qClose").onclick=()=>{
  if(confirm("Quitter le match ? Ta progression ne sera pas enregistrée.")) fermerQCM();
};

/* ================= NAVIGATION ================= */
function goTab(tab){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("on"));
  document.getElementById("sec-"+tab).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  window.scrollTo(0,0);
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>goTab(b.dataset.tab));

/* ================= TAILLE TEXTE ================= */
function applyScale(s){ document.documentElement.style.setProperty("--scale",s); STATE.scale=s; save(STATE);
  document.querySelectorAll(".aa button").forEach(b=>b.classList.toggle("on", +b.dataset.scale===s)); }
document.querySelectorAll(".aa button").forEach(b=>b.onclick=()=>applyScale(+b.dataset.scale));

/* ================= INIT ================= */
function init(){
  document.getElementById("avatarIcon").textContent="⚽";
  const t=new Date();
  const _n=Object.values(STATE.notes||{});
  const _avg=_n.length? _n.reduce((a,b)=>a+b.note,0)/_n.length : 0;
  const _rang=_n.length===0?"Remplaçant":_avg<10?"Remplaçant":_avg<13?"Titulaire":_avg<16?"Capitaine":"Ballon d'Or";
  document.getElementById("todayStr").textContent=dateLisible(t)+" · "+_rang;
  applyScale(STATE.scale||1);
  renderAccueil(); renderTest(); renderSuivi(); renderFiches(); renderDictee();
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
}
init();
</script>
